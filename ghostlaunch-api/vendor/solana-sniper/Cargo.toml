[package]
name = "solana-sniper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
dotenvy = "0.15"
futures = "0.3"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address = { version = "2", features = ["curve25519"] }
solana-compute-budget-interface = "3.1"
solana-hash = "4"
solana-instruction = "4"
solana-keypair = "3"
solana-message = "4"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util", "net"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
yellowstone-grpc-client = { version = "13", features = ["test-tools"] }
yellowstone-grpc-proto = "12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
